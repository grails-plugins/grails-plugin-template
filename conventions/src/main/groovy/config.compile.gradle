// It is maintained in the grails-plugin-template repository.
// https://github.com/grails-plugins/grails-plugin-template/tree/main/conventions
import java.nio.charset.StandardCharsets

plugins {
    id 'groovy'
}

tasks.withType(JavaCompile).configureEach {
    options.with {
        compilerArgs.add('-parameters')
        encoding = StandardCharsets.UTF_8.name()
        fork = true
        incremental = true
        release.set(resolveSdkmanJavaMajor(project))
    }
    options.forkOptions.with {
        jvmArgs.add('-Xmx1g')
        memoryMaximumSize = '1g'
    }
}

// Grails 8 and later decide invokedynamic in their own Gradle plugin (grails { indy = ... }): Grails 8 compiles classic
// call sites, Grails 9 invokedynamic, which Groovy 6 needs. Grails 7's Gradle plugin has no such setting, so a Grails 7
// build keeps the classic call sites these conventions have always compiled.
boolean grailsDecidesIndy = grailsGradlePluginHasIndySetting(getClass().classLoader)

tasks.withType(GroovyCompile).configureEach {
    options.with {
        compilerArgs.add('-parameters')
        encoding = StandardCharsets.UTF_8.name()
        fork = true
        incremental = true
    }
    groovyOptions.with {
        encoding = StandardCharsets.UTF_8.name()
        if (!grailsDecidesIndy) {
            optimizationOptions.indy = false
        }
        parameters = true
    }
    groovyOptions.forkOptions.with {
        memoryMaximumSize = '1g'
        jvmArgs.add('-Xmx1g')
    }
}

private static boolean grailsGradlePluginHasIndySetting(ClassLoader loader) {
    try {
        Class.forName('org.grails.gradle.plugin.core.GrailsExtension', false, loader).getMethod('getIndy')
        return true
    } catch (ClassNotFoundException | NoSuchMethodException ignored) {
        return false
    }
}

private static Provider<Integer> resolveSdkmanJavaMajor(Project project) {
    project.providers.provider {
        def sdkmanrc = project.rootProject.file('.sdkmanrc')
        if (!sdkmanrc.exists()) {
            throw new GradleException('Missing .sdkmanrc in root project')
        }

        def props = new Properties()
        sdkmanrc.withInputStream { props.load(it) }

        def raw = props.getProperty('java')?.trim()
        if (!raw) {
            throw new GradleException('Missing java version in root project .sdkmanrc')
        }

        def major = raw.tokenize('.').first()
        if (!(major ==~ /\d+/)) {
            throw new GradleException(
                    "Invalid java version '$raw' in root project .sdkmanrc (major '$major' is not an integer)"
            )
        }

        return major.toInteger()

    } as Provider<Integer>
}

