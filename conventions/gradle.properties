# Coordinates of the conventions plugin when it is published on its own
group=io.github.gpc
version=1.0.0-SNAPSHOT

# Versions of the Gradle plugins the convention plugins are built on. These are pinned here, not in the
# consuming repository, so that consumers only need to depend on one version of the conventions.
grailsVersion=7.0.11
asciidoctorVersion=4.0.5
spockVersion=2.3-groovy-3.0
testLoggerVersion=4.0.0

# Defaults for the tool versions used by the convention plugins. A consuming repository can override
# any of them in its own root gradle.properties:
#   checkstyleVersion, codenarcVersion, jacocoVersion
