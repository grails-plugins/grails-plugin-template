plugins {
    id 'groovy-gradle-plugin'
    id 'maven-publish'
}

dependencies {
    implementation platform("org.apache.grails:grails-bom:${grailsVersion}")
    implementation 'org.apache.groovy:groovy-yaml'
    implementation 'cloud.wondrify:asset-pipeline-gradle'
    implementation "com.adarshr:gradle-test-logger-plugin:${testLoggerVersion}"
    implementation 'org.apache.grails:grails-gradle-plugins'
    implementation 'org.apache.grails.gradle:grails-publish'
    implementation "org.asciidoctor.jvm.convert:org.asciidoctor.jvm.convert.gradle.plugin:${asciidoctorVersion}"

    testImplementation gradleTestKit()
    // Gradle compiles plugins with its embedded Groovy 3, so the Groovy 4 Spock artifact from the bom can't be used
    testImplementation "org.spockframework:spock-core:${spockVersion}"
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

// testImplementation extends implementation, which brings Groovy 4 (groovy-yaml); the tests must run on Gradle's Groovy 3
configurations.matching { it.name in ['testCompileClasspath', 'testRuntimeClasspath'] }.configureEach {
    exclude group: 'org.apache.groovy'
    exclude group: 'org.codehaus.groovy'
    // the grails-bom (inherited through implementation) manages the Groovy 4 variant of Spock
    resolutionStrategy.force "org.spockframework:spock-core:${spockVersion}"
}
