plugins {
    id 'groovy-gradle-plugin'
    id 'maven-publish'
    id 'org.apache.grails.gradle.grails-publish' version "${grailsPublishVersion}" apply false
}

// The conventions are versioned and released together with the template: the version is the root project's
// projectVersion (a -PprojectVersion=... on the command line, as the release workflow passes, takes precedence).
def rootProperties = new Properties()
file('../gradle.properties').withInputStream { rootProperties.load(it) }
version = findProperty('projectVersion') ?: rootProperties.getProperty('projectVersion')

// grails-publish decides between snapshot and release from the version, so apply it only once that is set
apply plugin: 'org.apache.grails.gradle.grails-publish'

// Published to Maven Central as org.grails.plugins.gradle:grails-plugin-conventions. Consumers resolve the
// config.* plugin ids through that one artifact (see TEMPLATE_README), so the plugin marker artifacts that
// java-gradle-plugin generates are not published: their group would be the plugin id (e.g. `config.compile`),
// which is not a namespace Maven Central accepts.
grailsPublish {
    githubSlug = 'grails-plugins/grails-plugin-template'
    license {
        name = 'Apache-2.0'
    }
    title = 'Grails Plugin Conventions'
    desc = 'Gradle convention plugins shared by Grails plugin repositories built on grails-plugin-template'
    organization {
        name = 'Grails Plugins'
        url = 'https://github.com/grails-plugins'
    }
    developers = [sbglasius: 'Søren Berg Glasius']
}

tasks.withType(PublishToMavenRepository).configureEach {
    onlyIf { publication.name == 'maven' }
}

// Consumers build on the Java version from .sdkmanrc (17 today), so never emit newer bytecode
java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

dependencies {
    implementation platform("org.apache.grails:grails-bom:${grailsVersion}")
    implementation 'org.apache.groovy:groovy-yaml'
    implementation "com.adarshr:gradle-test-logger-plugin:${testLoggerVersion}"
    implementation "org.asciidoctor.jvm.convert:org.asciidoctor.jvm.convert.gradle.plugin:${asciidoctorVersion}"

    // The Gradle plugins that follow the Grails line (7.x for Grails 7 / Gradle 8, 8.x for Grails 8 / Gradle 9) are
    // only compiled against. A runtime dependency would end up in the published POM and force this grailsVersion on
    // every consumer, so the consumer puts them on its classpath at its own grailsVersion instead (settings.gradle).
    compileOnly platform("org.apache.grails:grails-bom:${grailsVersion}")
    compileOnly 'cloud.wondrify:asset-pipeline-gradle'
    compileOnly 'org.apache.grails:grails-gradle-plugins'
    compileOnly 'org.apache.grails.gradle:grails-publish'

    testImplementation gradleTestKit()
    // Gradle compiles plugins with its embedded Groovy 3, so the Groovy 4 Spock artifact from the bom can't be used
    testImplementation "org.spockframework:spock-core:${spockVersion}"
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    // GrailsLineSpec builds a consumer on each Grails line (the Grails 8 one needs Java 21 to run the tests)
    systemProperty('grailsVersion', grailsVersion)
    systemProperty('grails8Version', grails8Version)
    systemProperty('grails8Gradle', grails8GradleVersion)
}

// testImplementation extends implementation, which brings Groovy 4 (groovy-yaml); the tests must run on Gradle's Groovy 3
configurations.matching { it.name in ['testCompileClasspath', 'testRuntimeClasspath'] }.configureEach {
    exclude group: 'org.apache.groovy'
    exclude group: 'org.codehaus.groovy'
    // the grails-bom (inherited through implementation) manages the Groovy 4 variant of Spock
    resolutionStrategy.force "org.spockframework:spock-core:${spockVersion}"
}
