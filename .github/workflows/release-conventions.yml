# Template-only workflow (files-sync.yml does not copy it): when a GitHub release of the template is published,
# release the conventions Gradle plugin (org.grails.plugins.gradle:grails-plugin-conventions) to Maven Central at the
# same version. The version is taken from the release tag (v1.2.3 -> 1.2.3), like the child repos' release.yml.
# Once the plugin is released, files-sync.yml opens the sync PRs that point the registered repos at that version.
name: "Release Conventions"
on:
  release:
    types: [ published ]
permissions: { }
env:
  GRAILS_PUBLISH_RELEASE: 'true'
  JAVA_DISTRIBUTION: 'liberica'
  REPO_NAME: ${{ github.event.repository.name }}
  RUN_ID: ${{ github.run_id }}
  RUN_ATTEMPT: ${{ github.run_attempt }}
  TAG: ${{ github.event.release.tag_name }}
  VERSION: 'will be computed in each job'
concurrency:
  group: release-pipeline
  cancel-in-progress: false
jobs:
  test:
    name: "Test Conventions"
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: "📥 Checkout repository"
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - name: "Export .sdkmanrc properties"
        uses: apache/grails-github-actions/export-gradle-properties@asf
        with:
          file: ".sdkmanrc"
          prefix: "SDKMANRC_"
      - name: "Determine Java Version"
        run: echo "SDKMANRC_java=${{ env.SDKMANRC_java }}" | sed 's/-.*//' >> $GITHUB_ENV
      - name: "☕️ Setup JDK"
        uses: actions/setup-java@v6
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.SDKMANRC_java }}
      - name: "🐘 Setup Gradle"
        uses: gradle/actions/setup-gradle@v6
      - name: "🧪 Test convention plugins"
        run: ./gradlew -p conventions test --stacktrace
  stage:
    name: "Stage Conventions"
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      packages: read  #  pre-release workflow
      contents: write  #  to create a release
      issues: write  #  to modify milestones
    steps:
      - name: "📝 Establish release version"
        run: echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
      - name: "📥 Checkout repository"
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ env.TAG }}
      - name: 'Ensure Common Build Date' # to ensure a reproducible build
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"
      - name: "Ensure source files use common date"
        run: |
          find . -depth \( -type f -o -type d \) -exec touch -d "@${SOURCE_DATE_EPOCH}" {} +
      - name: "🔐 Generate key file for artifact signing"
        env:
          SECRING_FILE: ${{ secrets.SECRING_FILE }}
        run: echo "$SECRING_FILE" | base64 -d > ${{ github.workspace }}/secring.gpg
      - name: "Export .sdkmanrc properties"
        uses: apache/grails-github-actions/export-gradle-properties@asf
        with:
          file: ".sdkmanrc"
          prefix: "SDKMANRC_"
      - name: "Determine Java Version"
        run: echo "SDKMANRC_java=${{ env.SDKMANRC_java }}" | sed 's/-.*//' >> $GITHUB_ENV
      - name: "☕️ Setup JDK"
        uses: actions/setup-java@v6
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.SDKMANRC_java }}
      - name: "🐘 Setup Gradle"
        uses: gradle/actions/setup-gradle@v6
      - name: "⚙️ Run pre-release"
        uses: apache/grails-github-actions/pre-release@asf
        env:
          RELEASE_VERSION: ${{ env.VERSION }}
      - name: "📤 Publish to Maven Central staging"
        env:
          NEXUS_PUBLISH_USERNAME: ${{ secrets.NEXUS_PUBLISH_USERNAME }}
          NEXUS_PUBLISH_PASSWORD: ${{ secrets.NEXUS_PUBLISH_PASSWORD }}
          NEXUS_PUBLISH_URL: 'https://ossrh-staging-api.central.sonatype.com/service/local/'
          NEXUS_PUBLISH_DESCRIPTION: '${{ env.REPO_NAME }}:${{ env.VERSION }}:${{ env.RUN_ID }}:${{ env.RUN_ATTEMPT }}'
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSPHRASE: ${{ secrets.SIGNING_PASSPHRASE }}
        run: >
          ./gradlew -p conventions
          -PprojectVersion=${{ env.VERSION }}
          -Psigning.secretKeyRingFile=${{ github.workspace }}/secring.gpg
          publishMavenPublicationToSonatypeRepository
          closeSonatypeStagingRepository
  release:
    name: "Release Conventions"
    environment: release # this step will be delayed until approved
    needs: stage
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: "📝 Establish release version"
        run: echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
      - name: "📥 Checkout repository"
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - name: "Export .sdkmanrc properties"
        uses: apache/grails-github-actions/export-gradle-properties@asf
        with:
          file: ".sdkmanrc"
          prefix: "SDKMANRC_"
      - name: "Determine Java Version"
        run: echo "SDKMANRC_java=${{ env.SDKMANRC_java }}" | sed 's/-.*//' >> $GITHUB_ENV
      - name: "☕️ Setup JDK"
        uses: actions/setup-java@v6
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.SDKMANRC_java }}
      - name: "🐘 Setup Gradle"
        uses: gradle/actions/setup-gradle@v6
      - name: "📤 Release staging repository"
        env:
          NEXUS_PUBLISH_USERNAME: ${{ secrets.NEXUS_PUBLISH_USERNAME }}
          NEXUS_PUBLISH_PASSWORD: ${{ secrets.NEXUS_PUBLISH_PASSWORD }}
          NEXUS_PUBLISH_URL: 'https://ossrh-staging-api.central.sonatype.com/service/local/'
          NEXUS_PUBLISH_DESCRIPTION: '${{ env.REPO_NAME }}:${{ env.VERSION }}:${{ env.RUN_ID }}:${{ env.RUN_ATTEMPT }}'
        run: >
          ./gradlew -p conventions
          -PprojectVersion=${{ env.VERSION }}
          findSonatypeStagingRepository
          releaseSonatypeStagingRepository
  close:
    name: "To Next Version"
    environment: close # this step will be delayed until approved
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: write # required for gradle.properties revert
      issues: write # required for milestone closing
      pull-requests: write # to create the PR that will increment the version
    steps:
      - name: "📥 Checkout repository"
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: "⚙️ Run post-release"
        uses: apache/grails-github-actions/post-release@asf
  sync:
    name: "Sync Registered Repos"
    needs: release
    uses: ./.github/workflows/files-sync.yml
    with:
      conventions_version: ${{ github.event.release.tag_name }}
      source_ref: ${{ github.event.release.tag_name }}
    permissions:
      contents: read
    secrets: inherit
